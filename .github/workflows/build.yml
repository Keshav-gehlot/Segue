name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Protocol and engine tests
        run: |
          set -o pipefail
          ./gradlew :core:selfTest :engine:selfTest --stacktrace 2>&1 | tee tests.log

      - name: Reproduce the paper's simulation
        run: |
          set -o pipefail
          ./gradlew :core:experiments 2>&1 | tee experiments.log
          cmp core/build/results/handoff_sim.csv results/handoff_sim.csv
          echo "handoff_sim.csv is byte-identical to the committed results"

      - name: Build the Android app
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee app.log

      - name: Show errors
        if: failure()
        run: |
          for f in tests.log experiments.log app.log; do
            if [ -f "$f" ] && ! grep -q "BUILD SUCCESSFUL" "$f"; then python3 tools/ci/annotate.py "$f"; break; fi
          done

      - uses: actions/upload-artifact@v5
        with:
          name: segue-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish the APK as a GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          SHORT=$(git rev-parse --short HEAD)
          cp app/build/outputs/apk/debug/app-debug.apk "segue-${VERSION}-debug.apk"
          sha256sum "segue-${VERSION}-debug.apk" > "segue-${VERSION}-debug.apk.sha256"
          NOTES="Debug build of ${GITHUB_SHA} (${SHORT}), built and tested by CI run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Install on all test devices; every build is signed with the same committed debug key, so it upgrades in place."
          # Rolling "latest" release: always the newest build of main.
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest --target "$GITHUB_SHA" --title "Segue ${VERSION} (latest build, ${SHORT})" \
            --notes "$NOTES" --latest "segue-${VERSION}-debug.apk" "segue-${VERSION}-debug.apk.sha256"
          # Versioned release, created once per versionName.
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "Segue ${VERSION}" --notes "$NOTES" --latest=false \
              "segue-${VERSION}-debug.apk" "segue-${VERSION}-debug.apk.sha256"
          fi
